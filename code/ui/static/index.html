<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TorQ-Crypto Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Courier New', monospace; font-size: 13px; background: #0d1117; color: #c9d1d9; padding: 16px; }
  .topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: bold; color: #e6edf3; }
  .status-pill { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; }
  .status-live { background: #0d2e0d; color: #3fb950; border: 1px solid #238636; }
  .status-reconnecting { background: #2e0d0d; color: #f85149; border: 1px solid #6e2a2a; }
  label { font-size: 12px; color: #8b949e; }
  select { font-family: inherit; font-size: 12px; padding: 3px 6px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; }

  .section { background: #161b22; border: 1px solid #30363d; margin-bottom: 16px; }
  .section-header { background: #1c2128; padding: 6px 12px; font-weight: bold; font-size: 12px; border-bottom: 1px solid #30363d; display: flex; align-items: center; justify-content: space-between; color: #e6edf3; }
  .section-header .refresh-note { font-weight: normal; font-size: 10px; color: #484f58; }

  table { border-collapse: collapse; width: 100%; }
  th { background: #1c2128; padding: 6px 10px; text-align: right; border: 1px solid #30363d; font-size: 11px; white-space: nowrap; color: #8b949e; }
  th.sym-col { text-align: left; }
  th.left { text-align: left; }
  td { padding: 6px 10px; text-align: right; border: 1px solid #21262d; white-space: nowrap; font-size: 12px; color: #c9d1d9; }
  td.sym-cell { text-align: left; font-weight: bold; background: #1c2128; color: #e6edf3; }
  td.mid-cell { font-weight: bold; background: #1c2128; color: #e6edf3; }
  td.left { text-align: left; }
  td.up { background: #0d2e0d; color: #3fb950; }
  td.dn { background: #2e0d0d; color: #f85149; }
  td.blank { color: #484f58; }
  tr.arb-row td { background: #1e2010; }
  tr.arb-row td.profit-pos { background: #0d2e0d; color: #3fb950; font-weight: bold; }
  td.best-bid { background: #0d2e0d; color: #3fb950; font-weight: bold; }
  td.best-ask { background: #2e0d0d; color: #f85149; font-weight: bold; }
  td.spread-cell { color: #8b949e; }

  /* OHLC stats bar */
  .ohlc-bar { display: flex; flex-wrap: wrap; gap: 0; padding: 10px 12px; }
  .ohlc-stat { flex: 1 1 80px; min-width: 80px; padding: 6px 12px; border-right: 1px solid #21262d; }
  .ohlc-stat:last-child { border-right: none; }
  .ohlc-label { font-size: 10px; color: #484f58; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 3px; }
  .ohlc-value { font-size: 14px; font-weight: bold; color: #e6edf3; }
  .ohlc-empty { padding: 14px 12px; color: #484f58; font-size: 12px; }

  .chart-wrap { padding: 12px; }
  svg.chart { display: block; width: 100%; height: 180px; }
  .chart-label { font-size: 10px; fill: #484f58; }
  .chart-axis { stroke: #30363d; stroke-width: 1; }
  .chart-grid { stroke: #21262d; stroke-width: 1; }
  .chart-line { fill: none; stroke: #58a6ff; stroke-width: 1.5; stroke-linejoin: round; }
  .no-data { text-anchor: middle; font-size: 12px; fill: #484f58; }
</style>
</head>
<body>

<div class="topbar">
  <h1>TorQ-Crypto</h1>
  <span id="status" class="status-pill status-reconnecting">Reconnecting</span>
  <label>Instrument:&nbsp;<select id="sym-select"><option value="">—</option></select></label>
</div>

<div class="section">
  <div class="section-header">Live Prices</div>
  <div style="overflow-x:auto">
    <table>
      <thead><tr id="grid-head"><th class="sym-col">Instrument</th></tr></thead>
      <tbody id="grid-body"></tbody>
    </table>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <span>Order Book — <span id="ob-title">—</span></span>
    <span class="refresh-note">live</span>
  </div>
  <div style="overflow-x:auto">
    <table id="ob-table">
      <thead><tr>
        <th class="left">Venue</th>
        <th>Bid</th>
        <th>Ask</th>
        <th>Spread</th>
        <th>Mid</th>
      </tr></thead>
      <tbody id="ob-body"><tr><td colspan="5" class="ohlc-empty">Select an instrument</td></tr></tbody>
    </table>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <span>Consolidated Mid — <span id="chart-title">—</span> (last 30 min)</span>
    <span class="refresh-note">auto-refresh 5s</span>
  </div>
  <div class="chart-wrap">
    <svg id="chart" class="chart" viewBox="0 0 800 160" preserveAspectRatio="xMidYMid meet">
      <text x="400" y="80" class="no-data">Select an instrument</text>
    </svg>
  </div>
</div>

<div class="section">
  <div class="section-header">
    <span>Session OHLC — <span id="ohlc-title">—</span></span>
    <span class="refresh-note">auto-refresh 60s</span>
  </div>
  <div id="ohlc-body"><div class="ohlc-empty">Select an instrument</div></div>
</div>

<div class="section">
  <div class="section-header">
    <span>Arbitrage — <span id="arb-title">—</span> (last 30 min, 5s buckets)</span>
    <span class="refresh-note">auto-refresh 10s</span>
  </div>
  <div style="overflow-x:auto">
    <div id="arb-body"><div class="ohlc-empty">Select an instrument</div></div>
  </div>
</div>

<script>
"use strict";

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
var state = {
  venues: [],
  syms: [],
  data: {},
  prevPrice: {},
  selectedSym: null
};

// ---------------------------------------------------------------------------
// WebSocket
// ---------------------------------------------------------------------------
var ws = null;
var wsTimer = null;

function wsConnect() {
  var proto = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(proto + "//" + location.host + "/ws");

  ws.onopen = function() {
    document.getElementById("status").textContent = "Live";
    document.getElementById("status").className = "status-pill status-live";
    if (wsTimer) { clearTimeout(wsTimer); wsTimer = null; }
  };

  ws.onmessage = function(evt) {
    var msg;
    try { msg = JSON.parse(evt.data); } catch(e) { return; }
    if (msg.type === "consolidated") onConsolidated(msg.data);
  };

  ws.onclose = function() {
    document.getElementById("status").textContent = "Reconnecting";
    document.getElementById("status").className = "status-pill status-reconnecting";
    wsTimer = setTimeout(wsConnect, 3000);
  };

  ws.onerror = function() { ws.close(); };
}

// ---------------------------------------------------------------------------
// Live prices — WebSocket data
// ---------------------------------------------------------------------------
function onConsolidated(rows) {
  var newVenues = new Set(state.venues);
  var newSyms   = new Set(state.syms);

  rows.forEach(function(r) {
    var sym   = String(r.sym);
    var venue = String(r.venue);
    newVenues.add(venue);
    newSyms.add(sym);
    if (!state.data[sym]) state.data[sym] = {};
    state.data[sym][venue] = r;
  });

  var sortedVenues = Array.from(newVenues).sort();
  var sortedSyms   = Array.from(newSyms).sort();

  var structChanged =
    sortedVenues.join("|") !== state.venues.join("|") ||
    sortedSyms.join("|")   !== state.syms.join("|");

  if (structChanged) {
    state.venues = sortedVenues;
    state.syms   = sortedSyms;
    rebuildGrid();
    rebuildSymSelect();
  } else {
    updateCells(rows);
  }
  renderOrderBook();
}

// ---------------------------------------------------------------------------
// Grid build / update
// ---------------------------------------------------------------------------
function rebuildGrid() {
  var thead = document.querySelector("#grid-head");
  thead.innerHTML = "<th class='sym-col'>Instrument</th>"
    + state.venues.map(function(v){ return "<th>" + esc(v) + "</th>"; }).join("")
    + "<th>Consolidated Mid</th>";

  var tbody = document.getElementById("grid-body");
  tbody.innerHTML = "";
  state.syms.forEach(function(sym) {
    var tr = document.createElement("tr");
    var html = "<td class='sym-cell'>" + esc(sym) + "</td>";
    state.venues.forEach(function(venue) {
      var row = state.data[sym] && state.data[sym][venue];
      var price = row ? fmtPrice(row.price) : "—";
      var blank = row ? "" : " blank";
      html += "<td id='c-" + esc(sym) + "-" + esc(venue) + "' class='" + blank + "'>" + price + "</td>";
    });
    html += "<td class='mid-cell' id='m-" + esc(sym) + "'>" + calcMid(sym) + "</td>";
    tr.innerHTML = html;
    tbody.appendChild(tr);
  });
}

function updateCells(rows) {
  rows.forEach(function(r) {
    var sym   = String(r.sym);
    var venue = String(r.venue);
    var cell  = document.getElementById("c-" + sym + "-" + venue);
    if (!cell) return;

    var key  = sym + "|" + venue;
    var prev = state.prevPrice[key];
    var price = Number(r.price);

    cell.textContent = fmtPrice(price);
    cell.className   = "";
    if (prev != null) {
      if (price > prev)      { cell.className = "up"; }
      else if (price < prev) { cell.className = "dn"; }
      setTimeout(function() { if (cell) cell.className = ""; }, 1200);
    }
    state.prevPrice[key] = price;

    var midCell = document.getElementById("m-" + sym);
    if (midCell) midCell.textContent = calcMid(sym);
  });
}

function calcMid(sym) {
  var mids = state.venues
    .map(function(v) { return state.data[sym] && state.data[sym][v] && state.data[sym][v].mid; })
    .filter(function(m) { return m != null && !isNaN(Number(m)); })
    .map(Number);
  if (!mids.length) return "—";
  var avg = mids.reduce(function(a,b){return a+b;}, 0) / mids.length;
  return avg.toFixed(4);
}

// ---------------------------------------------------------------------------
// Sym select
// ---------------------------------------------------------------------------
function rebuildSymSelect() {
  var sel  = document.getElementById("sym-select");
  var prev = sel.value;
  sel.innerHTML = "";
  state.syms.forEach(function(sym) {
    var opt = document.createElement("option");
    opt.value = sym;
    opt.textContent = sym;
    if (sym === prev || (!prev && sym === state.syms[0])) opt.selected = true;
    sel.appendChild(opt);
  });
  var selected = sel.value;
  if (selected && selected !== state.selectedSym) {
    state.selectedSym = selected;
    onSymChange();
  } else if (!state.selectedSym && state.syms.length) {
    state.selectedSym = state.syms[0];
    sel.value = state.selectedSym;
    onSymChange();
  }
}

document.getElementById("sym-select").addEventListener("change", function() {
  state.selectedSym = this.value || null;
  onSymChange();
});

function onSymChange() {
  var sym = state.selectedSym || "—";
  document.getElementById("chart-title").textContent = sym;
  document.getElementById("ob-title").textContent    = sym;
  document.getElementById("ohlc-title").textContent  = sym;
  document.getElementById("arb-title").textContent   = sym;
  renderOrderBook();
  if (state.selectedSym) {
    loadChart();
    loadOhlc();
    loadArbitrage();
  }
}

// ---------------------------------------------------------------------------
// Chart (SVG polyline) — /api/history
// ---------------------------------------------------------------------------
var chartData = [];
var chartRefreshTimer = null;

async function loadChart() {
  var sym = state.selectedSym;
  if (!sym) return;
  try {
    var resp = await fetch("/api/history?sym=" + encodeURIComponent(sym) + "&mins=30");
    if (!resp.ok) { drawChart([]); return; }
    var rows = await resp.json();
    chartData = rows
      .map(function(r) { return { t: new Date(r.time).getTime(), mid: Number(r.mid) }; })
      .filter(function(r) { return !isNaN(r.t) && !isNaN(r.mid); })
      .sort(function(a, b) { return a.t - b.t; });
    drawChart(chartData);
  } catch(e) {
    drawChart([]);
  }
}

function drawChart(data) {
  var svg = document.getElementById("chart");
  var VW = 800, VH = 160;
  var pad = { top: 10, right: 20, bottom: 24, left: 58 };
  var iW = VW - pad.left - pad.right;
  var iH = VH - pad.top - pad.bottom;

  if (!data || data.length < 2) {
    svg.innerHTML = "<text x='" + (VW/2) + "' y='" + (VH/2) + "' class='no-data'>No data</text>";
    return;
  }

  var ts   = data.map(function(d){return d.t;});
  var mids = data.map(function(d){return d.mid;});
  var tMin = Math.min.apply(null, ts),   tMax = Math.max.apply(null, ts);
  var yMin = Math.min.apply(null, mids), yMax = Math.max.apply(null, mids);
  var yPad = (yMax - yMin) * 0.05 || 1;
  yMin -= yPad; yMax += yPad;

  function tx(t)   { return pad.left + (tMax === tMin ? iW/2 : (t - tMin) / (tMax - tMin) * iW); }
  function ty(m)   { return pad.top  + iH - (m - yMin) / (yMax - yMin) * iH; }
  function fmtT(t) {
    var d = new Date(t);
    return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  }

  var gridLines = "";
  var yLevels = [yMin + yPad, (yMin + yMax) / 2, yMax - yPad];
  yLevels.forEach(function(v) {
    var y = ty(v);
    gridLines +=
      "<line class='chart-grid' x1='" + pad.left + "' y1='" + y + "' x2='" + (VW - pad.right) + "' y2='" + y + "'/>" +
      "<text class='chart-label' x='" + (pad.left - 4) + "' y='" + (y + 4) + "' text-anchor='end'>" + v.toFixed(2) + "</text>";
  });

  var xLabels =
    "<text class='chart-label' x='" + pad.left + "' y='" + (VH - 4) + "' text-anchor='middle'>" + fmtT(tMin) + "</text>" +
    "<text class='chart-label' x='" + (VW - pad.right) + "' y='" + (VH - 4) + "' text-anchor='middle'>" + fmtT(tMax) + "</text>";

  var pts = data.map(function(d){ return tx(d.t).toFixed(1) + "," + ty(d.mid).toFixed(1); }).join(" ");

  svg.innerHTML =
    gridLines +
    "<line class='chart-axis' x1='" + pad.left + "' y1='" + pad.top + "' x2='" + pad.left + "' y2='" + (pad.top + iH) + "'/>" +
    "<line class='chart-axis' x1='" + pad.left + "' y1='" + (pad.top + iH) + "' x2='" + (VW - pad.right) + "' y2='" + (pad.top + iH) + "'/>" +
    "<polyline class='chart-line' points='" + pts + "'/>" +
    xLabels;
}

// ---------------------------------------------------------------------------
// Order book — driven by live WebSocket data
// ---------------------------------------------------------------------------
function renderOrderBook() {
  var tbody = document.getElementById("ob-body");
  var sym = state.selectedSym;
  if (!sym || !state.data[sym]) {
    tbody.innerHTML = "<tr><td colspan='5' class='ohlc-empty'>No data</td></tr>";
    return;
  }

  var venueData = state.venues
    .map(function(v) { return state.data[sym] && state.data[sym][v]; })
    .filter(Boolean);

  if (!venueData.length) {
    tbody.innerHTML = "<tr><td colspan='5' class='ohlc-empty'>No data</td></tr>";
    return;
  }

  var bids = venueData.map(function(r) { return Number(r.bid); });
  var asks = venueData.map(function(r) { return Number(r.ask); });
  var bestBid = Math.max.apply(null, bids);
  var bestAsk = Math.min.apply(null, asks);

  tbody.innerHTML = venueData.map(function(r) {
    var bid    = Number(r.bid);
    var ask    = Number(r.ask);
    var mid    = Number(r.mid);
    var spread = ask - bid;
    var bidClass = (bid === bestBid) ? " class='best-bid'" : "";
    var askClass = (ask === bestAsk) ? " class='best-ask'" : "";
    return "<tr>" +
      "<td class='left sym-cell'>" + esc(String(r.venue)) + "</td>" +
      "<td" + bidClass + ">" + fmtPrice(bid) + "</td>" +
      "<td" + askClass + ">" + fmtPrice(ask) + "</td>" +
      "<td class='spread-cell'>" + fmtPrice(spread) + "</td>" +
      "<td>" + fmtPrice(mid) + "</td>" +
      "</tr>";
  }).join("");
}

// ---------------------------------------------------------------------------
// OHLC session stats — /api/ohlc
// ---------------------------------------------------------------------------
var ohlcRefreshTimer = null;

async function loadOhlc() {
  var sym = state.selectedSym;
  if (!sym) return;
  var el = document.getElementById("ohlc-body");
  try {
    var resp = await fetch("/api/ohlc?sym=" + encodeURIComponent(sym));
    if (!resp.ok) { el.innerHTML = "<div class='ohlc-empty'>Unavailable</div>"; return; }
    var rows = await resp.json();
    if (!rows || !rows.length) { el.innerHTML = "<div class='ohlc-empty'>No data</div>"; return; }
    renderOhlc(el, rows[rows.length - 1]);
  } catch(e) {
    el.innerHTML = "<div class='ohlc-empty'>Error loading data</div>";
  }
}

function renderOhlc(el, row) {
  var stats = [
    { label: "Open",   value: fmtPrice(row.open)   },
    { label: "High",   value: fmtPrice(row.high)   },
    { label: "Low",    value: fmtPrice(row.low)    },
    { label: "Close",  value: fmtPrice(row.close)  },
    { label: "VWAP",   value: fmtPrice(row.vwap)   },
    { label: "Volume", value: fmtVol(row.volume)   }
  ];
  el.innerHTML = "<div class='ohlc-bar'>" +
    stats.map(function(s) {
      return "<div class='ohlc-stat'><div class='ohlc-label'>" + esc(s.label) +
             "</div><div class='ohlc-value'>" + esc(s.value) + "</div></div>";
    }).join("") +
    "</div>";
}

// ---------------------------------------------------------------------------
// Arbitrage table — /api/arbitrage
// ---------------------------------------------------------------------------
var arbRefreshTimer = null;

async function loadArbitrage() {
  var sym = state.selectedSym;
  if (!sym) return;
  var el = document.getElementById("arb-body");
  try {
    var resp = await fetch("/api/arbitrage?sym=" + encodeURIComponent(sym) + "&mins=30");
    if (!resp.ok) { el.innerHTML = "<div class='ohlc-empty'>Unavailable</div>"; return; }
    var rows = await resp.json();
    if (!rows || !rows.length) { el.innerHTML = "<div class='ohlc-empty'>No data for this period</div>"; return; }
    renderArbitrage(el, rows);
  } catch(e) {
    el.innerHTML = "<div class='ohlc-empty'>Error loading data</div>";
  }
}

function renderArbitrage(el, rows) {
  // Detect venue names from column names matching /^(.+)Bid$/
  var allCols = Object.keys(rows[0] || {});
  var venues = allCols
    .filter(function(c) { return /Bid$/.test(c) && !/BidSize$/.test(c); })
    .map(function(c) { return c.replace(/Bid$/, ""); })
    .sort();

  // Table header
  var headCells = "<th class='left'>Time</th>";
  venues.forEach(function(v) {
    headCells += "<th>" + esc(v) + " Bid</th><th>" + esc(v) + " Ask</th><th>" + esc(v) + " BidSz</th><th>" + esc(v) + " AskSz</th>";
  });
  headCells += "<th>Profit</th><th>Arb</th>";

  // Table rows (newest first)
  var bodyRows = rows.slice().reverse().map(function(r) {
    var isArb = r.arbitrage === true || r.arbitrage === 1;
    var trClass = isArb ? " class='arb-row'" : "";
    var cells = "<td class='left'>" + fmtTime(r.time) + "</td>";
    venues.forEach(function(v) {
      cells += "<td>" + fmtPrice(r[v + "Bid"])     + "</td>";
      cells += "<td>" + fmtPrice(r[v + "Ask"])     + "</td>";
      cells += "<td>" + fmtVol(r[v + "BidSize"])   + "</td>";
      cells += "<td>" + fmtVol(r[v + "AskSize"])   + "</td>";
    });
    var profitVal = Number(r.profit);
    var profitClass = (isArb && profitVal > 0) ? " class='profit-pos'" : "";
    cells += "<td" + profitClass + ">" + (isNaN(profitVal) ? "—" : profitVal.toFixed(4)) + "</td>";
    cells += "<td>" + (isArb ? "YES" : "—") + "</td>";
    return "<tr" + trClass + ">" + cells + "</tr>";
  }).join("");

  el.innerHTML =
    "<table><thead><tr>" + headCells + "</tr></thead><tbody>" + bodyRows + "</tbody></table>";
}

// ---------------------------------------------------------------------------
// Auto-refresh schedulers
// ---------------------------------------------------------------------------
function scheduleChartRefresh() {
  if (chartRefreshTimer) clearInterval(chartRefreshTimer);
  chartRefreshTimer = setInterval(loadChart, 5000);
}

function scheduleOhlcRefresh() {
  if (ohlcRefreshTimer) clearInterval(ohlcRefreshTimer);
  ohlcRefreshTimer = setInterval(loadOhlc, 60000);
}

function scheduleArbRefresh() {
  if (arbRefreshTimer) clearInterval(arbRefreshTimer);
  arbRefreshTimer = setInterval(loadArbitrage, 10000);
}

scheduleChartRefresh();
scheduleOhlcRefresh();
scheduleArbRefresh();

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function fmtPrice(v) {
  var n = Number(v);
  if (isNaN(n) || v == null) return "—";
  return n >= 1000 ? n.toFixed(2) : n >= 1 ? n.toFixed(4) : n.toPrecision(5);
}

function fmtVol(v) {
  var n = Number(v);
  if (isNaN(n) || v == null) return "—";
  if (n >= 1e6)  return (n / 1e6).toFixed(2) + "M";
  if (n >= 1000) return (n / 1000).toFixed(2) + "K";
  return n.toFixed(4);
}

function fmtTime(v) {
  if (!v) return "—";
  var d = new Date(v);
  if (isNaN(d.getTime())) return String(v);
  return String(d.getHours()).padStart(2,"0") + ":" +
         String(d.getMinutes()).padStart(2,"0") + ":" +
         String(d.getSeconds()).padStart(2,"0");
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ---------------------------------------------------------------------------
// Start
// ---------------------------------------------------------------------------
wsConnect();
</script>
</body>
</html>
